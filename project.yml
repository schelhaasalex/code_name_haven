name: Reclaim
options:
  bundleIdPrefix: com.alexschelhaas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 73TQJ9R77A   # public: it is in every app this team signs
    # "Reclaim" is a WORKING NAME — the business name isn't settled. Every
    # place a person sees it reads this, so renaming is one line here plus
    # `app.name` in copy/strings.json. Target and module names stay: nobody
    # sees them.
    APP_DISPLAY_NAME: Reclaim
    # Where card, invite and tag links point, and the site whose
    # apple-app-site-association lets them open the app (links/). A testing
    # address until there is a real domain; cards printed against it stop
    # working when it changes, invites expire anyway.
    LINK_DOMAIN: haven-links-lime.vercel.app
    # The version people see. The BUILD number is deliberately not here: a
    # setting in this file wins over an xcconfig, so it would override the
    # generated one and every upload would carry the same stale number. It
    # comes from Config/Base.xcconfig, written by scripts/generate.sh.
    MARKETING_VERSION: "0.1"
    # iPhone only. It's a phone you set down; a portrait-only app that also
    # runs on iPad is refused at upload unless it demands full screen.
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  ReclaimKit:
    path: ReclaimKit

targets:
  Reclaim:
    type: application
    platform: iOS
    sources:
      - Reclaim
    dependencies:
      - package: ReclaimKit
      - target: ReclaimWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexschelhaas.reclaim
        CODE_SIGN_ENTITLEMENTS: Reclaim/Reclaim.entitlements
      # NO CODE_SIGN_IDENTITY HERE, deliberately. Signing is automatic, and
      # automatic signing picks the identity itself — Apple Development to
      # run, Apple Distribution to archive. Naming one by hand makes Xcode
      # refuse the whole target: "conflicting provisioning settings ... is
      # automatically signed for development, but a conflicting code signing
      # identity Apple Distribution has been manually specified."
      #
      # It was added to get around "Your team has no devices...", which is a
      # different problem with a different answer: register a device. An
      # Apple-silicon Mac counts, as "My Mac (Designed for iPhone)".
    # Every Info.plist key lives here. INFOPLIST_KEY_* build settings only
    # apply when Xcode generates the plist, and XcodeGen writes this one — so
    # they were silently dropped, and the app ran letterboxed with no motion
    # or NFC usage strings and Live Activities switched off.
    info:
      path: Reclaim/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LINK_DOMAIN: $(LINK_DOMAIN)
        # The app's only encryption is the system's own HTTPS. Saying so here
        # means App Store Connect doesn't ask about export compliance on
        # every build uploaded.
        ITSAppUsesNonExemptEncryption: false
        # The static launch screen is the same flat paper as `Palette.bone`, so
        # there is no flash between it and SplashView's first frame. It was an
        # empty dictionary, which means the system background — white in light
        # mode, BLACK in dark — and the app then cut to bone. LaunchBone has a
        # single universal colour on purpose: the launch screen is paper in both
        # appearances, because the app is. `scripts/shape.sh` keeps the hex here
        # equal to the one on the Palette; UIKit reads this plist before any
        # Swift runs, so the value genuinely has to live in two places.
        UILaunchScreen:
          UIColorName: LaunchBone
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait only, and full screen: a session is one quiet screen, never
        # a split view. Declared, so the upload check doesn't ask.
        UIRequiresFullScreen: true
        NSMotionUsageDescription: >-
          $(APP_DISPLAY_NAME) notices when your phone has been sitting still, so it can
          offer to count time you already spent away from it.
        NSCameraUsageDescription: >-
          $(APP_DISPLAY_NAME) reads the code on a place's card, so you can join the
          evening there. Nothing else is looked at, and nothing is kept.
        NFCReaderUsageDescription: >-
          $(APP_DISPLAY_NAME) writes the card for a place onto a tag, and reads one when
          you'd rather scan than type.
        NSBluetoothAlwaysUsageDescription: >-
          When you set your phone down, $(APP_DISPLAY_NAME) lets the phones at the same
          table find this evening, so the people around you can join it without
          scanning anything. It is never used to work out where you are.
        NSSupportsLiveActivities: true
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        # The phone that is DOWN keeps saying so while the screen is off —
        # that is the whole evening, and it is the only reason this is here.
        # The phone still in a hand listens in the foreground only, which
        # needs no mode at all, so `bluetooth-central` is deliberately absent.
        UIBackgroundModes: [bluetooth-peripheral]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [reclaim]

  ReclaimWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ReclaimWidgets
    dependencies:
      - package: ReclaimKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexschelhaas.reclaim.widgets
        CODE_SIGN_ENTITLEMENTS: ReclaimWidgets/ReclaimWidgets.entitlements
      # NO CODE_SIGN_IDENTITY HERE, deliberately. Signing is automatic, and
      # automatic signing picks the identity itself — Apple Development to
      # run, Apple Distribution to archive. Naming one by hand makes Xcode
      # refuse the whole target: "conflicting provisioning settings ... is
      # automatically signed for development, but a conflicting code signing
      # identity Apple Distribution has been manually specified."
      #
      # It was added to get around "Your team has no devices...", which is a
      # different problem with a different answer: register a device. An
      # Apple-silicon Mac counts, as "My Mac (Designed for iPhone)".
    info:
      path: ReclaimWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

# Two ways to press Run. Both are written out, because once any scheme is
# declared Xcode stops making the default one on its own.
schemes:
  Reclaim:
    build:
      targets:
        Reclaim: all
    run:
      config: Debug
    archive:
      config: Release

  # The whole app against the sample household (PreviewRepository), in memory,
  # already signed in, no network. Debug builds only — see ReclaimApp.init.
  Reclaim (Sample data):
    build:
      targets:
        Reclaim: all
    run:
      config: Debug
      commandLineArguments:
        "-sample-data": true
