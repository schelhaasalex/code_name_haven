name: Reclaim
options:
  bundleIdPrefix: com.reclaim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # set once you're enrolled
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  ReclaimKit:
    path: ReclaimKit

targets:
  Reclaim:
    type: application
    platform: iOS
    sources:
      - Reclaim
    dependencies:
      - package: ReclaimKit
      - target: ReclaimWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reclaim.app
        INFOPLIST_KEY_CFBundleDisplayName: Reclaim
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMotionUsageDescription: >-
          Reclaim notices when your phone has been sitting still, so it can
          offer to count time you already spent away from it.
        INFOPLIST_KEY_NSFaceIDUsageDescription: ""
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        CODE_SIGN_ENTITLEMENTS: Reclaim/Reclaim.entitlements
    info:
      path: Reclaim/Info.plist
      properties:
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        UIBackgroundModes: []
        CFBundleURLTypes:
          - CFBundleURLSchemes: [reclaim]

  ReclaimWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ReclaimWidgets
    dependencies:
      - package: ReclaimKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reclaim.app.widgets
        CODE_SIGN_ENTITLEMENTS: ReclaimWidgets/ReclaimWidgets.entitlements
    info:
      path: ReclaimWidgets/Info.plist
      properties:
        CFBundleDisplayName: Reclaim
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
