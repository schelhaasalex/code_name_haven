name: Reclaim
options:
  bundleIdPrefix: com.reclaim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # set once you're enrolled
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  ReclaimKit:
    path: ReclaimKit

targets:
  Reclaim:
    type: application
    platform: iOS
    sources:
      - Reclaim
    dependencies:
      - package: ReclaimKit
      - target: ReclaimWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reclaim.app
        CODE_SIGN_ENTITLEMENTS: Reclaim/Reclaim.entitlements
    # Every Info.plist key lives here. INFOPLIST_KEY_* build settings only
    # apply when Xcode generates the plist, and XcodeGen writes this one — so
    # they were silently dropped, and the app ran letterboxed with no motion
    # or NFC usage strings and Live Activities switched off.
    info:
      path: Reclaim/Info.plist
      properties:
        CFBundleDisplayName: Reclaim
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMotionUsageDescription: >-
          Reclaim notices when your phone has been sitting still, so it can
          offer to count time you already spent away from it.
        NFCReaderUsageDescription: >-
          Reclaim writes the card for a place onto a tag, and reads one when
          you'd rather scan than type.
        NSSupportsLiveActivities: true
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        UIBackgroundModes: []
        CFBundleURLTypes:
          - CFBundleURLSchemes: [reclaim]

  ReclaimWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ReclaimWidgets
    dependencies:
      - package: ReclaimKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reclaim.app.widgets
        CODE_SIGN_ENTITLEMENTS: ReclaimWidgets/ReclaimWidgets.entitlements
    info:
      path: ReclaimWidgets/Info.plist
      properties:
        CFBundleDisplayName: Reclaim
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

# Two ways to press Run. Both are written out, because once any scheme is
# declared Xcode stops making the default one on its own.
schemes:
  Reclaim:
    build:
      targets:
        Reclaim: all
    run:
      config: Debug
    archive:
      config: Release

  # The whole app against the sample household (PreviewRepository), in memory,
  # already signed in, no network. Debug builds only — see ReclaimApp.init.
  Reclaim (Sample data):
    build:
      targets:
        Reclaim: all
    run:
      config: Debug
      commandLineArguments:
        "-sample-data": true
