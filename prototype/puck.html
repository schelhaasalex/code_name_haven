<title>Puck Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: a full-bleed 3D room; quiet glass panels pinned to the corners, the voice line low and centred. */
  :root {
    --night:  #17140F;   /* the room after dark, from the app's night palette */
    --glass:  rgba(23, 20, 15, 0.66);
    --line:   rgba(243, 237, 225, 0.10);
    --cream:  #F3EDE1;
    --dust:   #A39685;
    --ember:  #E08A4E;
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans:  'Work Sans', ui-sans-serif, system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--night); color: var(--cream);
    font-family: var(--sans); font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(8, 6, 4, 0.55) 100%);
  }

  .panel {
    position: fixed; z-index: 2;
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px) saturate(120%);
    backdrop-filter: blur(16px) saturate(120%);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .eyebrow {
    margin: 0; font-size: 11px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: var(--dust);
  }

  /* top left: what you're looking at */
  #about { top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; width: min(320px, calc(100vw - 32px)); padding: 16px; display: grid; gap: 12px; }
  #about h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.1; text-wrap: balance; }
  #formNote { margin: 0; color: var(--dust); line-height: 1.5; min-height: 4.5em; }
  #formNote b { color: var(--cream); font-weight: 500; }

  .seg { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: rgba(243, 237, 225, 0.06); }
  .seg button {
    flex: 1; font: inherit; font-weight: 500; color: var(--dust);
    background: none; border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: rgba(243, 237, 225, 0.14); color: var(--cream); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

  /* top right: finishes and camera */
  #finish { top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; width: 236px; padding: 14px 16px; display: grid; gap: 14px; }
  #finish .group { display: grid; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    font: inherit; font-size: 13px; color: var(--cream);
    background: rgba(243, 237, 225, 0.05); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 10px 5px 6px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { border-color: rgba(243, 237, 225, 0.55); background: rgba(243, 237, 225, 0.12); }
  .swatch { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .ghost {
    font: inherit; font-size: 13px; color: var(--cream); cursor: pointer;
    background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  .ghost[aria-pressed="true"] { background: rgba(243, 237, 225, 0.12); border-color: rgba(243, 237, 225, 0.4); }
  #finishToggle, #finishClose { display: none; }

  /* bottom: the voice, then the controls */
  #dock {
    position: fixed; z-index: 2; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(640px, calc(100vw - 32px));
    display: flex; flex-direction: column; gap: 16px; pointer-events: none;
  }
  #voice { text-align: center; text-shadow: 0 1px 18px rgba(0, 0, 0, 0.6); }
  #status { margin: 0; font-family: var(--serif); font-weight: 300; font-size: clamp(24px, 4.2vw, 34px); line-height: 1.15; text-wrap: balance; transition: opacity .5s ease; }
  #sub { margin: 8px 0 0; color: var(--dust); font-size: 14px; min-height: 1.4em; }

  #controls { position: static; pointer-events: auto; padding: 12px; display: grid; gap: 12px; }
  #controls .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  #modeTabs { flex: 0 1 260px; }
  #hint { margin: 0; color: var(--dust); font-size: 12px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .primary {
    font: inherit; font-weight: 600; color: #1F1B16; cursor: pointer;
    background: var(--cream); border: 0; border-radius: 10px; padding: 10px 16px;
  }
  .primary:disabled { opacity: .4; cursor: default; }
  .secondary {
    font: inherit; font-weight: 500; color: var(--cream); cursor: pointer;
    background: rgba(243, 237, 225, 0.07); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px;
  }
  .secondary:disabled { opacity: .4; cursor: default; }
  .secondary[aria-pressed="true"] { background: rgba(243, 237, 225, 0.16); border-color: rgba(243, 237, 225, 0.45); }

  /* the inside view's callouts */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  #labels svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #labels line { stroke: rgba(243, 237, 225, 0.35); stroke-width: 1; }
  #labels circle { fill: var(--ember); }
  .tag { position: absolute; left: 0; top: 0; width: min(230px, 36vw); opacity: 0; transition: opacity .4s ease; }
  .tag.left { text-align: right; }
  .tag span {
    display: block; font-size: 12px; line-height: 1.4; color: var(--cream);
    background: var(--glass); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .tag b { display: block; font-weight: 600; }
  #dims { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; display: none; }
  #dims line { stroke: rgba(243, 237, 225, 0.75); stroke-width: 1; }
  #dims text { fill: var(--cream); font: 500 12px var(--sans); }
  body.dims #dims { display: block; }
  #about, #finish { transition: opacity .5s ease; }
  body.inside #about, body.inside #finish { opacity: 0; pointer-events: none; }

  #eveningBar { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
  #playBtn { width: 42px; height: 42px; padding: 0; display: grid; place-items: center; }
  #clock { font-variant-numeric: tabular-nums; font-weight: 500; min-width: 64px; text-align: right; }
  .track { position: relative; min-width: 0; }
  #ticks { position: absolute; left: 0; right: 0; top: -9px; height: 6px; pointer-events: none; }
  #ticks i { position: absolute; width: 2px; height: 6px; border-radius: 1px; background: var(--ember); opacity: .8; transform: translateX(-1px); }
  #narr { margin: 0; color: var(--dust); font-size: 12px; grid-column: 1 / -1; min-height: 1.3em; }
  input[type=range] { width: 100%; accent-color: var(--ember); margin: 0; }

  @media (max-width: 760px) {
    #about { padding: 12px; gap: 10px; }
    #about h1 { font-size: 20px; }
    #formNote { font-size: 13px; min-height: 0; }
    #finish { left: 16px; right: 16px; width: auto; z-index: 3; }
    #finish:not(.open) { display: none; }
    #finishToggle, #finishClose { display: inline-block; }
    #hint { display: none; }
  }
  @media (max-width: 760px) and (max-height: 760px) {
    #formNote { display: none; }
  }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"

</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

// Units are centimetres. A phone is 7.15 × 14.7 × 0.84.
const PHONE = { w: 7.15, l: 14.7, t: 0.84 };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────────────────────── renderer, scene, camera ───────────────────────── */

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 1, 3000);
camera.position.set(28, 46, 88);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 2, 0);
controls.minDistance = 22;
controls.maxDistance = 420;
controls.maxPolarAngle = Math.PI * 0.47;
controls.autoRotateSpeed = 0.6;

const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
// a real lens: the object sharp, the room behind it soft
const dof = new BokehPass(scene, camera, { focus: 100, aperture: 0.00003, maxblur: 0.007 });
composer.addPass(dof);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.55, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  goView(currentView, true);
});

/* ───────────────────────── procedural textures ───────────────────────── */

function rng(seed) { return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; }

function canvasTex(size, draw, repeat = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function grain(ctx, s, r, amount) {
  const img = ctx.getImageData(0, 0, s, s), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (r() - 0.5) * amount;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
}

function woodTex(base, line, seed, repeat) {
  return canvasTex(2048, (ctx, s) => {
    const r = rng(seed);
    ctx.fillStyle = base; ctx.fillRect(0, 0, s, s);
    for (let b = 0; b < 14; b++) {               // broad figure
      const y = r() * s, h = 20 + r() * 90;
      ctx.fillStyle = line; ctx.globalAlpha = 0.05 + r() * 0.08;
      ctx.fillRect(0, y, s, h);
    }
    for (let i = 0; i < 620; i++) {              // grain lines
      const y0 = r() * s, amp = 2 + r() * 10, f = 1 + Math.floor(r() * 3), ph = r() * 6.28;
      ctx.strokeStyle = line; ctx.globalAlpha = 0.06 + r() * 0.22; ctx.lineWidth = 0.4 + r() * 2.2;
      ctx.beginPath();
      for (let x = 0; x <= s; x += 8) {
        const y = y0 + Math.sin((x / s) * Math.PI * 2 * f + ph) * amp + Math.sin(x * 0.05 + ph) * 0.8;
        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    grain(ctx, s, r, 10);
  }, repeat);
}

function speckleTex(base, dots, seed, repeat, blotch) {
  return canvasTex(1024, (ctx, s) => {
    const r = rng(seed);
    ctx.fillStyle = base; ctx.fillRect(0, 0, s, s);
    for (let i = 0; i < 40; i++) {
      const x = r() * s, y = r() * s, rad = 40 + r() * 160;
      const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, blotch); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 0.25; ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    for (let i = 0; i < 9000; i++) {
      ctx.globalAlpha = 0.15 + r() * 0.5;
      ctx.fillStyle = dots[Math.floor(r() * dots.length)];
      const rad = 0.4 + r() * r() * 2.2;
      ctx.beginPath(); ctx.arc(r() * s, r() * s, rad, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    grain(ctx, s, r, 8);
  }, repeat);
}

// bead-blasted aluminium: an even, fine tooth, nothing that reads as a pattern
function blastTex(base, seed) {
  return canvasTex(512, (ctx, s) => { ctx.fillStyle = base; ctx.fillRect(0, 0, s, s); grain(ctx, s, rng(seed), 14); }, 1 / 6);
}

function radialTex() {
  return canvasTex(256, (ctx, s) => {
    const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.35, 'rgba(255,255,255,0.45)');
    g.addColorStop(0.7, 'rgba(255,255,255,0.1)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  });
}
const POOL_TEX = radialTex();

/* ───────────────────────── finishes and light colours ───────────────────────── */

const FINISHES = {
  walnut:   { label: 'Walnut',   swatch: '#6A4630', felt: '#2E2A26', make: () => ({ map: woodTex('#5E3C27', '#2A170C', 23, 1 / 40), roughness: 0.5, clearcoat: 0.3 }) },
  oak:      { label: 'Oak',      swatch: '#C9A274', felt: '#CDBFA8', make: () => ({ map: woodTex('#C29B6C', '#6E4A2A', 11, 1 / 40), roughness: 0.62, clearcoat: 0.15 }) },
  ebonized: { label: 'Ebonized oak', swatch: '#211B17', felt: '#2E2A26', make: () => ({ map: woodTex('#211B16', '#0A0705', 37, 1 / 40), roughness: 0.46, clearcoat: 0.35 }) },
  silver:   { label: 'Silver',   swatch: '#C9CCCF', felt: '#3A3836', metal: true, make: () => ({ map: blastTex('#C6C9CC', 83), roughness: 0.36 }) },
  graphite: { label: 'Graphite', swatch: '#4A4C50', felt: '#3A3836', metal: true, make: () => ({ map: blastTex('#4C4E52', 89), roughness: 0.42 }) },
};
const LEATHERS = {
  tan:     { label: 'Tan',     hex: '#9C6237' },
  black:   { label: 'Black',   hex: '#201D1B' },
  oxblood: { label: 'Oxblood', hex: '#5C2121' },
  stone:   { label: 'Stone',   hex: '#B5A996' },
};
const EDGES = { bevel: { r: 0.3, b: 0.14, seg: 1 }, eased: { r: 1.3, b: 0.38, seg: 5 }, soft: { r: 1.8, b: 0.65, seg: 7 } };
let edgeKey = 'eased', leatherLid = false, leatherKey = 'tan';
const GLOWS = {
  ember:  { label: 'Ember',  hex: '#FF7A2E' },
  candle: { label: 'Candle', hex: '#FFB45C' },
  linen:  { label: 'Linen',  hex: '#FFE3BE' },
};

const mats = {
  body: null, felt: null, end: null, thread: null,
  leather: null, deboss: new THREE.MeshStandardMaterial({ roughness: 0.75 }),
  brass: new THREE.MeshStandardMaterial({ color: '#C29A5B', metalness: 1, roughness: 0.28 }),
  plinth: new THREE.MeshStandardMaterial({ color: '#1B1612', roughness: 0.7 }),
};
let finishKey = 'walnut', glowKey = 'ember';
const glowColor = new THREE.Color(GLOWS[glowKey].hex);

function makeFinish(key) {
  const f = FINISHES[key], p = f.make();
  [mats.body, mats.felt, mats.end, mats.thread].forEach(m => { m?.map?.dispose(); m?.dispose(); });
  // a hand-oiled finish: a soft sheen over the grain, never a lacquer gloss
  mats.body = f.metal
    // bead-blasted and anodised: a fine, even satin with no grain to it
    ? new THREE.MeshPhysicalMaterial({ map: p.map, metalness: 1, roughness: p.roughness, bumpMap: p.map, bumpScale: 0.12 })
    : new THREE.MeshPhysicalMaterial({ map: p.map, roughness: p.roughness, clearcoat: Math.max(0.3, p.clearcoat || 0), clearcoatRoughness: 0.42, bumpMap: p.map, bumpScale: 0.6 });
  const endMap = p.map.clone(); endMap.rotation = Math.PI / 2; endMap.repeat.multiplyScalar(2.2); endMap.needsUpdate = true;
  mats.end = new THREE.MeshPhysicalMaterial({ map: endMap, color: '#B9A896', roughness: Math.min(1, p.roughness + 0.12), clearcoat: 0.25, clearcoatRoughness: 0.5, bumpMap: endMap, bumpScale: 0.8 });
  mats.thread = new THREE.MeshStandardMaterial({ color: new THREE.Color(f.felt).multiplyScalar(0.62), roughness: 0.9 });
  const feltMap = speckleTex(f.felt, ['#00000022', '#ffffff18'], 71, 1 / 6, 'rgba(0,0,0,0.05)');
  mats.felt = new THREE.MeshPhysicalMaterial({ map: feltMap, roughness: 1, sheen: 1, sheenRoughness: 0.8, sheenColor: new THREE.Color(f.felt).multiplyScalar(1.2) });
}
makeFinish(finishKey);

function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function roundedRectAt(w, h, r, cx, cy) {
  const s = new THREE.Path(), x = cx - w / 2, y = cy - h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function pool(size) {

function cmUV(geo, su, sv = su) {
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
  return geo;
}
// Grain that runs unbroken around the corners and over the front edge onto the top,
// as if the box were cut from one board. u follows the perimeter, starting at the back-left corner.
function grainUV(W, D, depth) {
  const P = 2 * (W + D);
  const per = (x, y) => {
    const dx = W / 2 - Math.abs(x), dy = D / 2 - Math.abs(y);
    if (dx <= dy) return x < 0 ? D / 2 - y : D + W + (y + D / 2);
    return y < 0 ? D + (x + W / 2) : 2 * D + W + (W / 2 - x);
  };
  return {
    generateTopUV(g, v, a, b, c) { return [a, b, c].map(i => new THREE.Vector2(D + v[i * 3] + W / 2, depth + v[i * 3 + 1] + D / 2)); },
    generateSideWallUV(g, v, a, b, c, d) {
      const us = [a, b, c, d].map(i => per(v[i * 3], v[i * 3 + 1]));
      if (Math.max(...us) - Math.min(...us) > P / 2) us.forEach((u, k) => { if (u < P / 2) us[k] = u + P; });
      return [a, b, c, d].map((i, k) => new THREE.Vector2(us[k], v[i * 3 + 2]));
    },
  };
}

}

function makeBox(g, cols, rows) {
  const E = EDGES[edgeKey];
  const T = 1.2, H = 5.2, P = 0.5, GAP = 0.06, IW = cols * BAY.w, ID = rows * BAY.d, W = IW + 2 * T, D = ID + 2 * T;
  const parts = [], labels = [];
  const explode = (obj, dy) => { obj.userData.base = obj.position.clone(); obj.userData.dy = dy; parts.push(obj); return obj; };
  const label = (obj, at, title, text, side) => labels.push({ obj, at: new THREE.Vector3(...at), title, text, side });
  // a slab whose outline, bevel included, lands exactly on w × d
  const slab = (w, d, depth, opts = {}) => {
    const b = opts.b ?? E.b, r = Math.max(0.05, (opts.r ?? E.r) - b);
    const shape = roundedRect(w - 2 * b, d - 2 * b, r);
    (opts.holes || []).forEach(h => shape.holes.push(h));
    const geo = new THREE.ExtrudeGeometry(shape, { depth: Math.max(0.01, depth - 2 * b), bevelEnabled: b > 0, bevelThickness: b, bevelSize: b, bevelSegments: opts.seg ?? E.seg, curveSegments: 12, UVGenerator: opts.uv });
    geo.rotateX(-Math.PI / 2); geo.translate(0, b, 0);
    return geo;
  };

  // a recessed plinth, so it sits on a line of shadow
  const plinth = new THREE.Mesh(new THREE.ExtrudeGeometry(roundedRect(W - 1.4, D - 1.4, Math.max(0.3, E.r - 0.7)), { depth: P, bevelEnabled: false, curveSegments: 12 }).rotateX(-Math.PI / 2), mats.plinth);
  plinth.castShadow = plinth.receiveShadow = true; g.add(explode(plinth, 0));

  // the driver board lives in the plinth and slides out of the back
  const board = new THREE.Group(); board.position.y = 0.2; g.add(explode(board, 3.5));
  const bw = Math.max(7, IW - 3), bd = Math.min(9, ID - 5);
  board.add(new THREE.Mesh(new THREE.BoxGeometry(bw, 0.16, bd), new THREE.MeshStandardMaterial({ map: pcbTex, roughness: 0.5, metalness: 0.2 })));

function buildForm(key) {

/* ───────────────────────── poses ───────────────────────── */

const qA = new THREE.Quaternion(), qB = new THREE.Quaternion(), qC = new THREE.Quaternion(), e3 = new THREE.Euler();
function backOut(t) { const c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
const X_AXIS = new THREE.Vector3(1, 0, 0), Y_AXIS = new THREE.Vector3(0, 1, 0);
const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
const ease = { io: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, out: t => 1 - Math.pow(1 - t, 3), sine: t => -(Math.cos(Math.PI * t) - 1) / 2 };

function restPose(i, pos, quat) {
  const s = device.slots[i];
  pos.copy(s.pos);
  quat.setFromEuler(e3.set(s.tilt || 0, s.yaw, s.flip ? Math.PI : 0, 'YXZ'));   // flip: screen up, back on the coil
}

function applyPose(i) {
  const ph = phones[i];
  if (i >= form.capacity) { ph.mesh.visible = false; return; }
  ph.mesh.visible = ph.p > 0.002;
  if (!ph.mesh.visible) return;
  restPose(i, vA, qA);
  const side = Math.sign(vA.x) || (i % 2 ? 1 : -1);
  vB.set(vA.x + side * 10, vA.y + 34, vA.z + 34);                             // in a hand, near the viewer
  qB.setFromEuler(e3.set(Math.PI * 0.8, device.slots[i].yaw + side * 0.5, side * 0.2, 'YXZ'));   // screen up
  const p = ph.p;
  const h = ease.out(p), v = ease.sine(p), r = ease.io(Math.min(1, p * 1.18));
  const pos = ph.mesh.position, quat = ph.mesh.quaternion;
  pos.set(THREE.MathUtils.lerp(vB.x, vA.x, h), THREE.MathUtils.lerp(vB.y, vA.y, v), THREE.MathUtils.lerp(vB.z, vA.z, h));
  quat.copy(qB).slerp(qA, r);
  if (device.slots[i].snap && p < 1) {
    // the last centimetre: the magnet ring takes over and pulls it square
    const k = backOut(THREE.MathUtils.smoothstep(p, 0.84, 0.95)), off = 1 - k;
    pos.x += 0.9 * side * off; pos.z += 0.5 * off;
    quat.multiply(qC.setFromAxisAngle(Y_AXIS, 0.14 * side * off));
  }
  if (ph.l > 0) {
    const l = ease.io(ph.l);
    vC.copy(vA).add({ x: 0, y: 13, z: 5 });
    pos.lerp(vC, l);
    quat.slerp(ph.liftQ, l);
  }
  if (device.phoneDy) pos.y += device.phoneDy * ease.io(inside.k);
  const fade = THREE.MathUtils.smoothstep(p, 0, 0.25);
  ph.mesh.userData.mats.forEach(m => { m.opacity = fade; m.transparent = fade < 0.999; m.depthWrite = fade > 0.5; });
  const shadow = fade > 0.7;
  if (ph.mesh.userData.shadow !== shadow) { ph.mesh.userData.shadow = shadow; ph.mesh.traverse(o => { if (o.isMesh) o.castShadow = shadow; }); }
  ph.mesh.userData.screen.emissiveIntensity = ph.l * 0.9;
}

function aimLift(i) {
  const ph = phones[i];
  restPose(i, vA, qA);
  const yaw = Math.atan2(camera.position.x - vA.x, camera.position.z - vA.z);
  // turned end over end so the screen faces you, top up
  ph.liftQ.setFromAxisAngle(Y_AXIS, yaw)
    .multiply(qB.setFromAxisAngle(X_AXIS, -1.92))
    .multiply(qA.setFromAxisAngle(Y_AXIS, Math.PI));
  // The lock screen shows what the phone would: the Live Activity, counting.
  const now = mode === 'evening' ? START + eveningM : 19 * 60 + manual.minutes;
  const since = mode === 'evening' ? START + (people()[i]?.in ?? 0) : 19 * 60;
  const scr = ph.mesh.userData.screen;
  scr.emissiveMap?.dispose();
  scr.emissiveMap = lockScreen(now, since);
  scr.needsUpdate = true;
}

/* ───────────────────────── sound ───────────────────────── */

let ac = null, master = null, soundOn = true, lastChime = 0;
function audio() {
  if (ac) return ac;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination); } catch { ac = null; }
  return ac;
}
function chime(first) {
  if (!soundOn || !audio() || performance.now() - lastChime < 220) return;
  lastChime = performance.now();
  const t = ac.currentTime + 0.02;
  const notes = first ? [[587.33, 0], [880, 0.16]] : [[659.25, 0], [987.77, 0.14]];
  notes.forEach(([f, d]) => {
    const g = ac.createGain(), o = ac.createOscillator(), o2 = ac.createOscillator(), g2 = ac.createGain();
    o.frequency.value = f; o2.frequency.value = f * 2.76; g2.gain.value = 0.08;
    o.connect(g); o2.connect(g2).connect(g); g.connect(master);
    g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(0.11, t + d + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 2.4);
    o.start(t + d); o2.start(t + d); o.stop(t + d + 2.5); o2.stop(t + d + 2.5);
  });
}
function thock() {
  if (!soundOn || !audio()) return;
  const len = 0.09, b = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = b; f.type = 'lowpass'; f.frequency.value = 520; g.gain.value = 0.5;
  s.connect(f).connect(g).connect(master); s.start();
}

function click() {
  if (!soundOn || !audio()) return;
  const len = 0.025, b = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 6);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = b; f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = 2; g.gain.value = 0.35;
  s.connect(f).connect(g).connect(master); s.start();
}

];

function people() { return form.capacity === 1 ? PEOPLE.slice(0, 1) : PEOPLE; }

function eveningState(m) {
  const ps = people();
  ps.forEach((pp, i) => {
    const ph = phones[i];
    const lifted = pp.lift && m >= pp.lift[0] && m < pp.lift[1];
    const t = m < pp.in || m >= pp.out ? 'away' : lifted ? 'lifted' : 'down';
    if (t === 'lifted' && ph.target !== 'lifted') aimLift(i);
    ph.target = t;
    ph.lit = m >= pp.in + 0.4 ? 1 : 0;
    ph.downAt = pp.lift && m >= pp.lift[1] ? pp.lift[1] : pp.in;
  });
  for (let i = ps.length; i < MAX; i++) { phones[i].target = 'away'; phones[i].lit = 0; }
}

/* ───────────────────────── words ───────────────────────── */

const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty'];
function word(n) { return n < 20 ? WORDS[n] : TENS[Math.floor(n / 10)] + (n % 10 ? '-' + WORDS[n % 10] : ''); }
function cap(s) { return s[0].toUpperCase() + s.slice(1); }
function duration(min) {
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  const hs = h ? (h === 1 ? 'an hour' : word(h) + ' hours') : '';
  const ms = m ? (m === 1 ? 'a minute' : word(m) + ' minutes') : '';
  return hs && ms ? hs + ' and ' + ms : hs || ms || 'a moment';
}
function clockShort(min) { const h = Math.floor(min / 60) % 12 || 12, m = Math.floor(min % 60); return h + ':' + String(m).padStart(2, '0'); }
function clock(min) { return clockShort(min) + (Math.floor(min / 60) >= 12 ? ' pm' : ' am'); }

function voice() {
  if (inside.target) return ['What’s inside', 'Proposed, not built: what it would take to make this properly.'];
  const ps = mode === 'evening' ? people() : null;
  const n = mode === 'evening' ? ps.filter(p => eveningM >= p.in).length : manual.count;
  const present = phones.slice(0, form.capacity).some(p => p.target !== 'away');
  const lifted = phones.slice(0, form.capacity).some(p => p.target === 'lifted');
  const over = mode === 'evening' ? n > 0 && !present && eveningM >= ps[ps.length - 1].out : manual.over;
  let span = 0;
  if (mode === 'evening' && n) span = Math.min(eveningM, Math.max(...ps.map(p => p.out))) - ps[0].in;
  if (mode === 'manual') span = manual.minutes;

  if (!n) return ['Nothing here yet.', mode === 'manual' ? `Click the ${formKey} to set a phone down.` : ''];
  if (over) return ['That’s the evening.', form.clock ? cap(duration(span)) + ', given back.' : `${cap(word(n))} of you, ${duration(span)}.`];
  if (lifted) return ['Picked up. The evening’s still counting.', 'You can always pick it up.'];
  if (form.clock) return span < 3 ? ['Docked. See you in a bit.', ''] : ['Docked. See you in a bit.', cap(duration(span)) + ' so far.'];
  if (n === 1) return ['Docked. See you in a bit.', ''];
  return [`${cap(word(n))} of you so far.`, ''];
}

let lastVoice = '';
function renderVoice() {
  const [a, b] = voice();
  if (a + b === lastVoice) return;
  lastVoice = a + b;
  document.getElementById('status').textContent = a;
  document.getElementById('sub').textContent = b;
}

/* ───────────────────────── glow ───────────────────────── */

const cTmp = new THREE.Color(), OFF = new THREE.Color('#1a1714');
function afterglow(minSinceEnd) { return 0.3 + 0.7 * Math.exp(-minSinceEnd / 14); }

function updateGlow(now) {
  const t = now / 1000;

/* ───────────────────────── frame ───────────────────────── */

      scrub.value = eveningM;

    }
    eveningState(eveningM);
    if (form.lid) lid.target = LID_CLOSED.some(([a, b]) => eveningM >= a && eveningM < b) ? 0 : 1;
    dayTarget = 1 - THREE.MathUtils.smoothstep(eveningM, 10, 75);
    renderEveningText();
  } else {
    if (manual.firstAt !== null && !manual.over) manual.minutes += dt;            // sped up: a minute a second
    else if (manual.over) manual.minutes += dt;
  }

  setDaylight(day);

  const scrubbing = mode === 'evening' && !playing && Math.abs(eveningM - prevM) > 0.001;
  const speed = scrubbing ? 6 : 1;
  prevM = eveningM;

    const e = ease.io(inside.k);

    if (lid.target < lid.open) lid.open = Math.max(0, lid.open - rate * (0.16 + 0.84 * THREE.MathUtils.smoothstep(lid.open, 0, 0.4)));

  renderVoice();

  device.group.traverse(o => { if (o.isMesh && (o.userData.role || o.userData.lid)) targets.push(o); });

let currentView = 'hero', tween = null;
const VIEWS = {

  close: { dir: [0.75, 0.3, 0.7], dist: 52, y: 3, fit: 0.75 },

}

scrub.addEventListener('input', () => { eveningM = +scrub.value; setPlaying(false); });

function drawTicks() {
  const el = $('ticks'); el.innerHTML = '';
  const marks = new Set();
  people().forEach(p => { marks.add(p.in); if (p.lift) marks.add(p.lift[0]); });
  marks.forEach(m => { const i = document.createElement('i'); i.style.left = (m / LEN * 100) + '%'; el.appendChild(i); });
}
let lastNarr = '';
function renderEveningText() {
  $('clock').textContent = clock(START + eveningM);
  let line = '';
  NARRATION.forEach(([m, s, only]) => { if (eveningM >= m && (!only || form[only])) line = s; });
  if (form.lid) line = line.replace('the tray', 'the box').replace('The tray', 'The box');
  if (line !== lastNarr) { $('narr').textContent = line; lastNarr = line; }
}

/* ───────────────────────── go ───────────────────────── */

buildForm('box');
drawTicks();
document.querySelectorAll('#formSeg button').forEach(b => b.addEventListener('click', drawTicks));
setDaylight(0);

// A table already in use, so the first frame shows what this is.
[0, 1, 2].forEach(() => addPhone());
phones.forEach(p => { if (p.target === 'down') { p.p = 1; p.landed = true; p.lit = 1; p.glow = 0.9; } });

if (location.hash === '#evening') setMode('evening');
requestAnimationFrame(frame);
window.__puck = { lid, inside, setInside, snap() { phones.forEach(p => { p.p = p.target === 'away' ? 0 : 1; p.l = p.target === 'lifted' ? 1 : 0; if (p.p) { p.landed = true; p.lit = 1; } }); }, phones, setMode, goView, buildForm, get eveningM() { return eveningM; }, set eveningM(v) { eveningM = v; scrub.value = v; } };
</script>
