<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open in the app</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #F7F4EE; color: #1F1B16; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 22rem; padding: 2rem; }
  .mark { width: 22px; height: 22px; border: 2px solid #B4512C; border-radius: 50%; position: relative; margin-bottom: 2rem; }
  .mark::after { content: ""; position: absolute; inset: 6px; background: #B4512C; border-radius: 50%; }
  h1 { font: 400 2rem/1.15 "New York", Georgia, serif; margin: 0 0 1rem; }
  p { color: #4A4239; margin: 0 0 1rem; }
  .note { color: #6B6155; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>This opens in the app.</h1>
  <p>It's a way into an evening somewhere, or an invitation to one. On an iPhone with the app installed, it opens there on its own.</p>
  <p class="note">Just installed it? Go back and tap the link again.</p>
</main>
</body>
</html>
