<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open in the app</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #F7F4EE; color: #1F1B16; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 22rem; padding: 2rem; }
  .mark { width: 22px; height: 22px; border: 2px solid #B4512C; border-radius: 50%; position: relative; margin-bottom: 2rem; }
  .mark::after { content: ""; position: absolute; inset: 6px; background: #B4512C; border-radius: 50%; }
  h1 { font: 400 2rem/1.15 "New York", Georgia, serif; margin: 0 0 1rem; }
  p { color: #4A4239; margin: 0 0 1rem; }
  .note { color: #6B6155; font-size: 14px; }
  .button { display: block; margin: 1.5rem 0; padding: 1.1rem; border-radius: 999px; background: #1F1B16;
            color: #F7F4EE; text-align: center; text-decoration: none; font-weight: 500; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <div id="card" hidden>
    <h1>This is your box&rsquo;s card.</h1>
    <p>Get the app, open it, and tap <b>Scan the card</b> with your phone beside the box. That&rsquo;s the only setup there is.</p>
    <a id="get" class="button" hidden>Get the app</a>
    <p class="note">Already have it? Open it and scan the card from there.</p>
  </div>
  <div id="other">
    <h1>Nothing here.</h1>
    <p>A box&rsquo;s card is how in: scan it with your phone beside the box.</p>
  </div>
</main>
<script>
  // Where "Get the app" goes. Empty until the app is on the App Store or has a
  // public TestFlight link; the button stays hidden until then.
  var STORE_URL = "";
  // /p/<secret> is the box's card, or a code a phone showed. Nothing else is
  // a box's: the slots' tags (/p/<secret>/<slot>, /d/…) are gone.
  var parts = location.pathname.split("/").filter(Boolean);
  if (parts[0] === "p" && parts.length === 2) {
    document.getElementById("card").hidden = false;
    document.getElementById("other").hidden = true;
    if (STORE_URL) {
      var get = document.getElementById("get");
      get.href = STORE_URL;
      get.hidden = false;
    }
  }
</script>
</body>
</html>
